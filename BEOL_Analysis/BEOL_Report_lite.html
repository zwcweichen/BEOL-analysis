<script>/* report/rules.js */
/* rules.js — BEOL/FEOL WAT diagnosis knowledge base (deterministic, reviewable, editable)
 *
 * Each category describes:
 *   match   : name regex / unit regex used to classify a column
 *   kind    : 'wat' (electrical) or 'inline' (metrology)
 *   up/down : what a positive / negative shift usually means physically, and what to check next
 *   pairs   : inline categories that physically drive this WAT item, with expected sign
 *             (sign −1: inline ↓ ⇒ WAT ↑ ; +1: same direction)
 * Wording is written so that it can be pasted into a report as-is.
 */
(function () {
  'use strict';
  const App = window.App;
  const R = (App.rules = {});

  // ------------------------------------------------------------ knowledge base: data → compiled categories
  const FIELDS = ['id', 'label', 'kind', 'metric', 'bad', 'name', 'unit', 'up_mean', 'up_causes', 'up_checks', 'down_mean', 'down_causes', 'down_checks', 'pairs', 'enabled', 'source', 'note', 'author', 'date'];
  R.FIELDS = FIELDS;
  const LISTF = ['up_causes', 'up_checks', 'down_causes', 'down_checks'];
  const toList = (v) => (Array.isArray(v) ? v : String(v ?? '').split(/\r?\n|；|\|/).map((x) => x.trim()).filter(Boolean));
  const esc = (t) => t.replace(/[.+^${}()|[\]\\]/g, '\\$&');
  /** glob "con_*;lk#*" → regex; a pattern without * also matches as a whole word of the name */
  R.globToRe = (pat) => {
    const alts = String(pat || '').split(';').map((x) => x.trim()).filter(Boolean);
    if (!alts.length) return null;
    const parts = alts.map((g) => {
      const body = esc(g).replace(/\\\*/g, '.*').replace(/\*/g, '.*').replace(/\?/g, '.').replace(/#/g, '\\d');
      return g.includes('*') ? `^${body}$` : `^${body}$|(?:^|[_\\-\\s])${body}(?:[_\\-\\s]|$)`;
    });
    return new RegExp(parts.join('|'), 'i');
  };
  /** flat rule (Excel / JSON row) → category object used by the engine */
  R.compileRule = (r) => {
    const c = { id: String(r.id).trim(), label: r.label || r.id, kind: r.kind || 'wat', metric: r.metric || 'k', bad: r.bad || '',
      name: R.globToRe(r.name), unit: R.globToRe(r.unit), log: r.metric === 'fold',
      up: { mean: r.up_mean || '偏高', causes: toList(r.up_causes), checks: toList(r.up_checks) },
      down: { mean: r.down_mean || '偏低', causes: toList(r.down_causes), checks: toList(r.down_checks) },
      pairs: String(r.pairs || '').split(';').map((x) => x.trim()).filter(Boolean).map((x) => { const [cat, sg] = x.split(':'); return { cat: cat.trim(), sign: (sg || '-').trim() === '+' ? +1 : -1 }; }),
      source: r.source || '', note: r.note || '', author: r.author || '', date: r.date || '', enabled: r.enabled !== false && String(r.enabled).toLowerCase() !== 'false' && r.enabled !== 0 && String(r.enabled) !== '0' && String(r.enabled) !== 'N',
      layer: r.layer || 'base', raw: { ...r } };
    return c;
  };
  /** normalise a flat rule so every field exists (lists as arrays) */
  R.normRule = (r) => {
    const o = {};
    for (const f of FIELDS) o[f] = LISTF.includes(f) ? toList(r[f]) : f === 'enabled' ? !(r[f] === false || r[f] === 0 || /^(false|0|n|no|否)$/i.test(String(r[f] ?? '').trim())) : String(r[f] ?? '').trim();
    return o;
  };
  /** canonical string for "is this rule different from the base?" (ignores author / date / note) */
  R.canon = (r) => { const o = R.normRule(r); delete o.author; delete o.date; delete o.note; return JSON.stringify(o); };
  /** merge base rules + fab overlay (same id → overlay replaces; new id → appended before 'other') */
  R.load = (base, overlay) => {
    const rules = (base?.rules || []).map((r) => ({ ...R.normRule(r), layer: 'base' }));
    for (const o of overlay?.rules || []) {
      const n = { ...R.normRule(o), layer: 'fab' };
      const i = rules.findIndex((r) => r.id === n.id);
      if (i >= 0) rules[i] = n; else { const j = rules.findIndex((r) => /^other/.test(r.id)); rules.splice(j < 0 ? rules.length : j, 0, n); }
    }
    R.RULES = rules;
    R.KB = { base: { version: base?.version || '', date: base?.date || '' }, fab: overlay ? { version: overlay.version || '', date: overlay.date || '', author: overlay.author || '', n: (overlay.rules || []).length } : null };
    R.CATS = rules.filter((r) => r.enabled || /^other/.test(r.id)).map(R.compileRule);
    for (const [id, label, kind] of [['other', '其他（WAT）', 'wat'], ['other_inline', '其他（inline）', 'inline'], ['other_yield', '其他（yield）', 'yield']]) if (!R.CATS.some((c) => c.id === id)) R.CATS.push(R.compileRule({ id, label, kind }));
    return R.CATS;
  };
  R.kbVersion = () => `知識庫 base v${R.KB?.base.version || '?'}${R.KB?.fab ? `＋fab 層 ${R.KB.fab.n} 條${R.KB.fab.version ? ` v${R.KB.fab.version}` : ''}` : ''}`;
  /** export the current merged rules as flat rows (for Excel / JSON) */
  R.exportRows = (layerOnly) => R.RULES.filter((r) => !layerOnly || r.layer === layerOnly).map((r) => { const o = {}; for (const f of FIELDS) o[f] = LISTF.includes(f) ? r[f].join('\n') : r[f]; o.layer = r.layer; return o; });
  /** which columns of a dataset each rule would match (dry run) */
  R.dryRun = (columns) => {
    const out = {};
    for (const c of R.CATS) out[c.id] = [];
    for (const col of columns) { const k = R.classify(col); if (!/^other/.test(k.cat)) out[k.cat].push({ col, conf: k.conf }); }
    return out;
  };
  R.load(App.RULES_BASE, App.store ? App.store.get('rpt-kb', null) : null);

  R.byId = (id) => R.CATS.find((c) => c.id === id) || R.CATS[R.CATS.length - 1];
  R.metricOf = (catId) => R.byId(catId).metric || 'k';

  /** WAT items that a given inline item physically drives (reverse of relatedInline) */
  R.relatedWat = (inlName, inlCat, items) => {
    const L = R.layer(inlName); if (!L) return [];
    const out = [];
    for (const it of items) {
      if (it.kind !== 'wat' || R.layer(it.name) !== L) continue;
      for (const p of R.byId(it.cat).pairs || []) {
        const ok = p.cat === inlCat || (p.cat === 'cd' && inlCat === 'vcd') || (p.cat === 'vcd' && inlCat === 'cd' && /^v/i.test(L));
        if (ok) { out.push({ item: it, sign: p.sign }); break; }
      }
    }
    return out;
  };

  /** wording for an inline mean shift; related = WAT items of the same layer with their cells */
  R.diagnoseInline = (cell, related) => {
    const cat = R.byId(cell.item.cat), L = R.layer(cell.item.name);
    const d = cat[cell.dir >= 0 ? 'up' : 'down'] || { mean: cell.dir >= 0 ? '偏高' : '偏低', causes: [], checks: [] };
    const impact = (related || []).map((r) => {
      const exp = Math.sign(cell.dir) * r.sign;   // expected WAT direction
      const wc = r.cell;
      const mv = !wc || wc.level === 'na' ? '無資料' : wc.level === 'green' ? '尚在綠燈' : `已${wc.dir * exp > 0 ? '同向' : '反向'}偏移（${wc.text}）`;
      return `${R.parseName(r.item.name).short} 預期${exp > 0 ? '上升' : '下降'} → 目前${mv}`;
    });
    return {
      title: `${R.parseName(cell.item.name).short}${cell.group && cell.group !== '全部' ? ` @ ${cell.group}` : ''}：${cell.cip} ${cell.text}`,
      mean: d.mean,
      cat: cat.label,
      causes: d.causes.map((c) => fill(c, L)),
      checks: d.checks.map((c) => fill(c, L)),
      verdict: impact.length ? `對 WAT 的預期影響：${impact.join('；')}。` : `資料中沒有 ${L || '該層'} 的 WAT 可以對照；建議到 WAT 戰報確認同層 Rs／LK／Rc 是否受影響。`,
      fallback: '比對 CIP lot 的機台履歷（tool commonality），確認偏移是否集中在特定 chamber／機台。',
    };
  };

  /** wording for a yield finding; related = abnormal WAT cells of the same group / CIP */
  R.diagnoseYield = (cell, related) => {
    const cat = R.byId(cell.item.cat);
    const d = cat[cell.dir >= 0 ? 'up' : 'down'] || { mean: cell.dir >= 0 ? '偏高' : '偏低', causes: [], checks: [] };
    const hit = (related || []).map((r) => `${R.parseName(r.item.name).short} ${r.cell.text}`);
    const byCat = {};
    (related || []).forEach((r) => { byCat[r.item.cat] = (byCat[r.item.cat] || 0) + 1; });
    const hint = Object.keys(byCat).map((k) => ({ lk: '線間漏電／短路', spa: '線間漏電／短路', vbd: '線間耐壓', rc: 'via 開路或高阻', rs: '金屬線高阻' }[k])).filter(Boolean);
    return {
      title: `${R.parseName(cell.item.name).short}${cell.group && cell.group !== '全部' ? ` @ ${cell.group}` : ''}：${cell.cip} ${cell.text}`,
      mean: d.mean,
      cat: cat.label,
      causes: d.causes.slice(), checks: d.checks.slice(),
      verdict: hit.length ? `同組 WAT 異常：${hit.join('、')} → 良率變化可能與${[...new Set(hint)].join('、') || '這些電性'}相關，建議先看這些 item 的 HL。` : '同組 WAT 沒有亮燈 → 電性未見異常，優先查缺陷（defect scan）、CP bin 分布與 wafer map 空間特徵。',
      fallback: '比對 CIP lot 的機台履歷（tool commonality），確認良率變化是否集中在特定機台。',
    };
  };

  /** wording for a variation finding (wafer-to-wafer σ or within-wafer uniformity) */
  R.diagnoseVar = (cell, which) => {
    const L = R.layer(cell.item.name);
    const isWiw = which === 'wiw', ratio = isWiw ? cell.wiwRatio : cell.sdRatio;
    const thk = cell.item.cat === 'thk';
    return {
      title: `${R.parseName(cell.item.name).short}${cell.group && cell.group !== '全部' ? ` @ ${cell.group}` : ''}：${cell.cip} ${isWiw ? '片內 σ' : 'wafer 間 σ'} ×${ratio.toFixed(2)}`,
      mean: isWiw ? '片內均勻性變差' : 'wafer 間變異放大',
      cat: R.byId(cell.item.cat).label,
      causes: isWiw
        ? (thk ? ['CMP edge profile 改變（retaining ring、pad conditioning、zone pressure）', 'ECP 電鍍均勻性', '前層 topography'] : ['Etch chamber center／edge 均勻性', 'Litho focus 在 edge shot 偏移', 'Hardmask 厚度均勻性'])
        : ['不同機台／chamber 間 mismatch', 'Lot-to-lot 控制不穩（APC 回饋、pad life 跨度大）', '量測機台 matching'],
      checks: isWiw
        ? [`看下方徑向分布：偏差集中在 edge 還是 center`, thk ? `${L || '該層'} CMP zone pressure、retaining ring 壽命` : `${L || '該層'} etch chamber 均勻性 monitor`, 'Wafer map 確認是否有特定 shot／方位']
        : ['依 chamber／機台分組比較 CIP wafer', 'APC log 與 pad／parts life', '量測機台 matching'],
      verdict: isWiw ? '片內 σ 是每片 wafer 各 site 的標準差平均；均值可能正常，但 edge／center 已經分開。' : 'Wafer 間 σ 是各片 wafer mean 的標準差；均值可能正常，但片與片之間不穩。',
      fallback: '若集中在特定機台 → 做機台 matching 或暫時分流。',
    };
  };

  /** split "Con_M12~OHM/SQ~Mean" → { short:'Con_M12', unit:'OHM/SQ', stat:'Mean' } */
  R.parseName = (name) => {
    let str = String(name);
    // "Mean(Item Value by Site, 07504.050 M15CUCMP_5, NOVA_THK)" → "M15CUCMP_5 NOVA_THK"（拿掉統計包裝、固定字樣、站點代碼）
    const w = str.match(/^(?:mean|avg|average|median|max|min|std|sd)\s*\((.+?)\)?\s*$/i);   // closing paren may be missing (truncated exports)
    if (w) {
      const parts = w[1].split(',').map((t) => t.trim()).filter((t) => t && !/^item value|by site|by wafer|^value$/i.test(t) && !/^\d+(?:\.\d+)?$/.test(t));
      str = parts.map((t) => t.replace(/^\d{3,}(?:\.\d+)?\s+/, '')).join(' ') || str;
    }
    if (str.includes('~')) { const p = str.split('~').map((s) => s.trim()); return { short: p[0], unit: p[1] || '', stat: p[2] || '' }; }
    const m = str.match(/^(.*?)\s*[(\[（]\s*([^)\]）]{1,12})\s*[)\]）]\s*$/);     // "RS_M3 (ohm/sq)", "M3 CD [nm]"
    return m && m[1] ? { short: m[1].trim(), unit: m[2].trim(), stat: '' } : { short: str.trim(), unit: '', stat: '' };
  };


  /** layer token, e.g. M12, V12, TM1, TV2, CT, PO */
  R.layer = (name) => {
    const s = R.parseName(name).short.replace(/VIA[_\- ]?(\d+)/ig, 'V$1').replace(/MET(?:AL)?[_\- ]?(\d+)/ig, 'M$1');   // VIA2 → V2, METAL3 → M3
    const m = s.match(/(?:^|[_\-\s])((?:TM|TV|M|V)\d+)(?:[_\-\s]|$)/i) || s.match(/((?:TM|TV|M|V)\d+)/i);
    return m ? m[1].toUpperCase() : '';
  };

  /** classify a column → { cat, conf } ; conf 0..1 */
  R.classify = (name) => {
    const { short, unit } = R.parseName(name);
    let best = { cat: 'other', conf: 0.2 };
    for (const c of R.CATS) {
      if (/^other/.test(c.id)) continue;
      const n = c.name && c.name.test(short), u = c.unit && unit && c.unit.test(unit);
      const conf = n && u ? 0.95 : n ? 0.75 : u ? 0.5 : 0;
      if (conf > best.conf) best = { cat: c.id, conf };
    }
    // inline CD of a via layer → via CD
    if (best.cat === 'cd' && /^v\d+/i.test(R.layer(name))) best.cat = 'vcd';
    // range／σ／max／min／uniformity 這類衍生統計欄：歸到該模組的「其他」，仍點燈但不配對
    if (R.STAT_SUFFIX.test(short) || /^(r|rng|range|sd|std|stdev|sigma|3s|max|min|nu|cv)$/i.test(unit || '')) {
      const kind = (R.byId(best.cat) || {}).kind || 'wat';
      best = { cat: kind === 'inline' ? 'other_inline' : kind === 'yield' ? 'other_yield' : 'other', conf: Math.max(best.conf, 0.6), stat: true };
    }
    return best;
  };
  /** derived-statistic suffixes: NOVA_THK_R, CD_SD, THK_3S, THK (R), *_MAX, *_NU, *_U% … */
  R.STAT_SUFFIX = /(?:[_\-\s]|\()(r|rng|range|sd|std|stdev|stddev|sigma|3s|3sigma|max|min|nu|u%|unif|uniformity|cv|wiw|w2w)\)?$/i;

  /** inline columns that physically relate to a WAT item (same layer, category from pairs) */
  R.relatedInline = (watName, watCat, items) => {
    const cat = R.byId(watCat), L = R.layer(watName);
    if (!cat.pairs || !L) return [];
    const out = [];
    for (const p of cat.pairs) {
      for (const it of items) {
        if (it.kind !== 'inline' || it.name === watName) continue;
        const iL = R.layer(it.name);
        const okCat = it.cat === p.cat || (p.cat === 'cd' && it.cat === 'vcd' && /^v/i.test(L)) || (p.cat === 'vcd' && it.cat === 'cd' && /^v/i.test(iL));
        if (okCat && iL === L) out.push({ item: it, sign: p.sign });
      }
    }
    return out;
  };

  /** adjacent layer name: Mn below → M(n−1); Vn below → Mn, above → M(n+1); TM／TV 同理 */
  R.adjLayer = (L, rel) => {
    const m = (L || '').match(/^(TM|TV|M|V)(\d+)$/i); if (!m) return '';
    const pre = m[1].toUpperCase(), n = +m[2], metal = pre === 'TM' ? 'TM' : pre === 'TV' ? 'TM' : 'M';
    if (pre === 'M' || pre === 'TM') return rel === 'below' ? (n > 1 ? `${metal}${n - 1}` : '') : '';
    return rel === 'below' ? `${metal}${n}` : `${metal}${n + 1}`;
  };
  /** cross-layer inline items for a WAT item: [{ item, sign, rel, layer, why, check }] (sign 0 = direction depends on pattern) */
  R.relatedXLayer = (watName, watCat, items) => {
    const L = R.layer(watName), tab = (window.App && App.XLAYER) || []; if (!L) return [];
    const out = [];
    for (const x of tab.filter((x) => x.wat === watCat)) {
      const A = R.adjLayer(L, x.rel); if (!A) continue;
      for (const it of items) {
        if (it.kind !== 'inline' || it.cat !== x.inl || R.layer(it.name) !== A) continue;
        const sub = (t) => t.replace(/\{B\}/g, A).replace(/\{A\}/g, A);
        out.push({ item: it, sign: x.sign, rel: x.rel, layer: A, why: x.why, check: sub(x.check) });
      }
    }
    return out;
  };

  const fill = (s, L) => s.replace(/\{L\}/g, L || '該層');

  /**
   * Build wording for one abnormal cell.
   * cell: { item, group, cip, k, mean, bmean, n, bn, level }
   * related: [{ item, sign, k }]  (K of the paired inline items in the same group/CIP)
   */
  /** relation of one paired item to the abnormal cell: strong（有偏移且 wafer 間有關聯）／weak（有偏移但關聯弱）／flat／opp／none */
  R.relOf = (rel, dirSign) => {
    if (rel.k == null || !isFinite(rel.k)) return 'none';
    const exp = rel.sign === 0 ? Math.sign(rel.k) : dirSign * rel.sign;
    if (Math.abs(rel.k) < 0.5) return 'flat';
    if (Math.sign(rel.k) !== exp) return 'opp';
    if (rel.r != null && Math.abs(rel.r) < 0.3) return 'weak';
    return 'strong';
  };
  R.fmtK = (k) => (Math.abs(k) >= 10 ? `>${k >= 0 ? '+' : '−'}10σ` : `${k >= 0 ? '+' : '−'}${Math.abs(k).toFixed(2)}σ`);
  R.fmtR = (r) => (r == null ? '' : `r = ${r >= 0 ? '' : '−'}${Math.abs(r).toFixed(2)}`);
  /** "V12 CD AEI −2.79σ（r = −0.84）" */
  // v3.0: r is used for the judgement but not shown（戰報只呈現偏移量與有無對上）；pass withR = true only in the check window
  R.relTxt = (rel, withR = false) => `${R.parseName(rel.item.name).short} ${R.fmtK(rel.k)}${withR && rel.r != null ? `（${R.fmtR(rel.r)}）` : ''}`;

  R.diagnose = (cell, related, xrel) => {
    const cat = R.byId(cell.item.cat);
    const L = R.layer(cell.item.name);
    const dirSign = Math.sign(cell.dir ?? cell.k) || 1;
    const dir = dirSign >= 0 ? 'up' : 'down';
    const d = cat[dir] || { mean: dir === 'up' ? '偏高' : '偏低', causes: [], checks: [] };
    const fmtK = R.fmtK;
    const grp = (arr) => { const o = { strong: [], weak: [], flat: [], opp: [] }; for (const r of arr || []) { const st = R.relOf(r, dirSign); if (o[st]) o[st].push(r); } return o; };
    const same = grp(related), x = grp(xrel);
    const lst = (a) => a.map((r) => R.relTxt(r)).join('、');
    const catLabel = (a) => a.map((r) => R.byId(r.item.cat).label.replace('（inline）', '')).join('／');
    let verdict = '', xline = '', xchecks = [];
    if (same.strong.length) {
      verdict = `同層 ${lst(same.strong)} 與 WAT 同向且 wafer 間有關聯 → 主因很可能是 ${catLabel(same.strong)} 偏移。`;
      if (same.opp.length) verdict += `（${lst(same.opp)} 反向，可能部分抵銷）`;
      if (x.strong.length) { xline = `鄰層 ${lst(x.strong)} 也有偏移，可能疊加。`; xchecks = [x.strong[0].check]; }
    } else if (x.strong.length) {
      const sameTxt = same.weak.length ? `同層 ${lst(same.weak)} 有偏移但關聯弱；` : same.flat.length ? `同層 ${same.flat.map((r) => R.relTxt(r, false)).join('、')} 未偏移；` : same.opp.length ? `同層 ${lst(same.opp)} 反向；` : '無同層 inline；';
      verdict = `${sameTxt}鄰層 ${lst(x.strong)} 同向且 wafer 間有關聯 → 建議先確認 ${x.strong[0].layer} 製程對本層的影響。`;
      xline = verdict; xchecks = [x.strong[0].check];
    } else if (same.weak.length) {
      verdict = `同層 ${lst(same.weak)} 有偏移但 wafer 間關聯弱 → ${catLabel(same.weak)} 可能只是部分原因，同時查製程條件與機台。`;
    } else if (same.flat.length || same.opp.length) {
      const parts = [];
      if (same.flat.length) parts.push(`${same.flat.map((r) => R.relTxt(r, false)).join('、')} 未偏移`);
      if (same.opp.length) parts.push(`${lst(same.opp)} 反向`);
      verdict = `同層 ${parts.join('；')} → 尺寸無法解釋，優先查製程條件（${cat.id === 'rc' ? 'via 底部殘留／barrier' : cat.id === 'rs' ? 'Cu 電鍍／barrier／晶粒' : '缺陷／材料'}）與機台 commonality。`;
      if (x.weak.length) verdict += `鄰層 ${lst(x.weak)} 有偏移但關聯弱，證據不足。`;
    } else {
      verdict = `資料中沒有 ${L || '該層'} 的 inline 可交叉比對 → 建議調出 ${fill(d.checks[0] || 'inline 數據', L)} 確認。`;
      if (x.weak.length) verdict += `鄰層 ${lst(x.weak)} 有偏移但關聯弱。`;
    }
    const xFirst = !same.strong.length && x.strong.length;
    return {
      title: `${R.parseName(cell.item.name).short}${cell.group && cell.group !== '全部' ? ` @ ${cell.group}` : ''}：${cell.cip} ${cell.text || `K ${fmtK(cell.k)}`}`,
      mean: d.mean,
      cat: cat.label,
      causes: d.causes.map((c) => fill(c, L)),
      checks: xFirst ? [...xchecks, ...d.checks.map((c) => fill(c, L))] : [...d.checks.map((c) => fill(c, L)), ...xchecks],
      verdict,
      xline,
      fallback: '若當層與鄰層 inline 都正常 → 比對 CIP lot 的機台履歷（tool commonality），找出共同經過的 chamber／機台。',
    };
  };
})();

</script>
<script>/* report/engine.js */
/* engine.js — BEOL report: data prep, auto-config, metrics (K / fold / rate / variation), findings */
(function () {
  'use strict';
  const App = window.App;
  const E = (App.rptEngine = {});
  const RU = () => App.rules;

  E.cat = (v) => (v == null ? '(空白)' : v instanceof Date ? App.fmtDate(v) : typeof v === 'number' ? App.fmtNum(v) : String(v));
  E.natCmp = (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
  const fmtK = (k) => (k == null || !isFinite(k) ? '—' : Math.abs(k) >= 10 ? `>${k >= 0 ? '+' : '−'}10σ` : `${k >= 0 ? '+' : '−'}${Math.abs(k).toFixed(2)}σ`);
  const pct = (x) => (x == null ? '—' : `${(x * 100).toFixed(x < 0.1 ? 1 : 0)}%`);
  E.fmtK = fmtK; E.pct = pct;
  const median = (a) => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

  // ------------------------------------------------------------------ load
  E.load = async (file, sheet) => {
    const wb = await App.importer.readFile(file);
    const src = App.importer.createSource(file, wb);
    if (sheet && sheet !== src.sheet && src.sheetNames.includes(sheet)) App.importer.loadSheet(src, sheet);
    return E.fromSource(src);
  };
  /** → { src, ds (one row per wafer, or the wide table as-is), siteDs: [site-level tables usable for within-wafer stats] } */
  E.fromSource = (src) => {
    App.state.datasets = [];
    const { datasets } = App.transform.buildDatasets(src);
    const ds = datasets.find((d) => d.kind === 'wafer') || datasets[0];
    const siteDs = src.format === 'long' ? datasets.filter((d) => d.kind === 'site' && !/tidy/.test(d.name)) : [];
    return { src, ds, siteDs };
  };

  E.dupRatio = (ds, waferCol) => {
    if (!waferCol) return 1;
    const s = new Set(ds.rows.map((r) => r[waferCol]));
    return ds.rows.length / Math.max(1, s.size);
  };
  /** collapse site rows to wafer mean (numbers) / first value (others) */
  E.toWafer = (ds, waferCol) => {
    const M = new Map();
    for (const r of ds.rows) {
      const k = r[waferCol]; if (k == null) continue;
      let a = M.get(k);
      if (!a) { a = { first: r, sum: {}, n: {} }; M.set(k, a); }
      for (const c of ds.columns) {
        const v = num(r[c.name]);
        if (c.type === 'number' && v != null) { a.sum[c.name] = (a.sum[c.name] || 0) + v; a.n[c.name] = (a.n[c.name] || 0) + 1; }
      }
    }
    const rows = [];
    for (const a of M.values()) {
      const o = { ...a.first };
      for (const c of ds.columns) if (c.type === 'number') o[c.name] = a.n[c.name] ? a.sum[c.name] / a.n[c.name] : null;
      rows.push(o);
    }
    return { ...ds, rows };
  };

  // ------------------------------------------------------------------ auto config
  const uniq = (rows, c) => new Set(rows.map((r) => r[c]).filter((v) => v != null)).size;
  /** most frequent value (for clamped / fixed-value items such as SPA = 20 V) */
  E.fixedValue = (rows, name) => {
    const cnt = new Map(); let n = 0;
    for (const r of rows) { const v = num(r[name]); if (v == null) continue; n++; const k = +v.toFixed(3); cnt.set(k, (cnt.get(k) || 0) + 1); }
    let best = null, bc = 0;
    for (const [k, c] of cnt) if (c > bc) { best = k; bc = c; }
    return n && bc / n >= 0.3 ? { target: best, share: bc / n } : null;
  };
  E.autoConfig = (ds) => {
    const cols = ds.columns, rows = ds.rows;
    const text = cols.filter((c) => c.type === 'text');
    const pick = (list, rx, lo, hi) => list.find((c) => rx.test(c.name) && (() => { const u = uniq(rows, c.name); return u >= lo && u <= hi; })());
    const waferCol = (cols.find((c) => c.role === 'wafer') || text.find((c) => /wafer/i.test(c.name)) || text[0] || {}).name || null;
    const lotCol = (cols.find((c) => c.role === 'lot') || {}).name || null;
    const dates = cols.filter((c) => c.type === 'datetime');
    const dateCol = (dates.find((c) => /wat/i.test(c.name)) || dates[0] || {}).name || null;
    const cand = text.filter((c) => c.name !== waferCol && c.name !== lotCol && !/最終/.test(c.name));
    // 1) a column whose VALUES look like condition labels (BSL／CIP／POR／baseline／ref／split…) wins over column names
    const condVals = /^(bsl|cip|por|base|ref|new|split|cond|exp|test|ctrl|control|std)/i;
    const byVal = cand.find((c) => { const u = uniq(rows, c.name); if (u < 2 || u > 12) return false; const vs = new Set(rows.map((r) => r[c.name]).filter((v) => v != null).map(String)); return [...vs].some((v) => condVals.test(v.trim())); });
    const condCol = (byVal || pick(cand, /fab|bsl|cip|split|cond|route|eqp|tool|chamber|recipe|type/i, 2, 12) ||
      cand.find((c) => { const u = uniq(rows, c.name); return u >= 2 && u <= 6 && !/part|product|prod|device|tech/i.test(c.name); }) ||
      cand.find((c) => { const u = uniq(rows, c.name); return u >= 2 && u <= 6; }) || {}).name || null;
    const groupCol = (pick(cand.filter((c) => c.name !== condCol), /part|product|prod|device|tech|^p\d|layer/i, 2, 30) || {}).name || '';
    const cfg = { waferCol, lotCol, dateCol, groupCol, condCol, baseline: null, cips: [], items: [] };
    E.setCond(cfg, ds);
    cfg.items = cols.filter((c) => c.type === 'number' && !c.count && c.role !== 'x' && c.role !== 'y' && uniq(rows, c.name) > 1)
      .filter((c) => !/^(site|x|y|r \(mm\)|slot|wafer|lot)$/i.test(c.name.trim()))
      .map((c) => {
        const k = RU().classify(c.name);
        return E.itemSetup({ name: c.name, cat: k.cat, conf: k.conf, on: true, n: rows.filter((r) => num(r[c.name]) != null).length }, rows);
      })
      .filter((it) => it.metric === 'rate' || uniq(rows, it.name) > 3);
    cfg.mode = E.KINDS.find((k) => cfg.items.some((i) => i.kind === k)) || 'wat';
    return cfg;
  };
  /** metric + fixed value for one item (re-run when the user changes its category) */
  E.itemSetup = (it, rows) => {
    const cat = RU().byId(it.cat);
    it.kind = cat.kind;
    it.metric = RU().metricOf(it.cat);
    it.target = null;
    if (it.metric === 'rate') {
      const fv = E.fixedValue(rows, it.name);
      if (fv) { it.target = fv.target; it.share = fv.share; } else it.metric = 'k';   // not clamped → fall back to K
    }
    if (it.metric === 'fold' && rows.some((r) => num(r[it.name]) != null && r[it.name] <= 0)) it.metric = 'k';
    return it;
  };
  /** baseline = most frequent condition value (or POR/BSL by name); CIPs = all others */
  E.setCond = (cfg, ds) => {
    if (!cfg.condCol) { cfg.baseline = null; cfg.cips = []; return; }
    const cnt = new Map();
    ds.rows.forEach((r) => { const v = r[cfg.condCol]; if (v != null) cnt.set(E.cat(v), (cnt.get(E.cat(v)) || 0) + 1); });
    const vals = [...cnt.entries()].sort((a, b) => b[1] - a[1]);
    const named = vals.find(([v]) => /^(por|bsl|base(line)?|ref)/i.test(v));
    cfg.baseline = (named || vals[0] || [null])[0];
    cfg.cips = vals.map(([v]) => v).filter((v) => v !== cfg.baseline);
    cfg.condCounts = Object.fromEntries(vals);
  };

  // ------------------------------------------------------------------ thresholds
  E.KINDS = ['wat', 'inline', 'yield'];
  E.MOD = { wat: 'WAT', inline: 'Inline', yield: 'Yield' };
  E.TH_DEFAULT = { kG: 1, kO: 1.5, fG: 2, fO: 5, rG: 2, rO: 5, sG: 1.3, sO: 1.6 };
  E.thresholds = () => {
    const t = { ...E.TH_DEFAULT, ...App.store.get('rpt-th', {}) };
    const old = App.store.get('rpt-k', null);   // v1.0 setting
    if (old && !App.store.get('rpt-th', null)) { t.kG = old.g; t.kO = old.o; }
    return t;
  };
  const lv = (x, g, o) => (x == null || !isFinite(x) ? 'na' : x <= g ? 'green' : x <= o ? 'yellow' : 'orange');
  const RANK = { na: 0, green: 1, yellow: 2, orange: 3 };
  E.worse = (a, b) => (RANK[a] >= RANK[b] ? a : b);

  /** within-wafer σ per item per wafer from site-level tables: Map(item → Map(wafer → σ)) */
  E.wiwMap = (siteDs, items, waferCol) => {
    const out = new Map();
    for (const d of siteDs || []) {
      const wc = (d.columns.find((c) => c.role === 'wafer') || {}).name || waferCol;
      for (const it of items) {
        if (!d.columns.some((c) => c.name === it.name) || out.has(it.name)) continue;
        const acc = new Map();
        for (const r of d.rows) { const v = num(r[it.name]); if (v == null) continue; const w = r[wc]; if (!acc.has(w)) acc.set(w, []); acc.get(w).push(v); }
        const m = new Map();
        for (const [w, a] of acc) if (a.length >= 3) m.set(w, App.stats(a).sd);
        if (m.size) out.set(it.name, m);
      }
    }
    return out;
  };

  // ------------------------------------------------------------------ compute
  E.compute = (ds, cfg, siteDs) => {
    const th = E.thresholds();
    const items = cfg.items.filter((i) => i.on);
    const groups = cfg.groupCol ? [...new Set(ds.rows.map((r) => E.cat(r[cfg.groupCol])))].sort(E.natCmp) : ['全部'];
    const gOf = (r) => (cfg.groupCol ? E.cat(r[cfg.groupCol]) : '全部');
    const cOf = (r) => E.cat(r[cfg.condCol]);
    const byG = new Map(groups.map((g) => [g, []]));
    ds.rows.forEach((r) => byG.get(gOf(r))?.push(r));
    const wiw = E.wiwMap(siteDs, items.filter((i) => i.kind === 'inline'), cfg.waferCol);
    const cells = {};
    for (const it of items) {
      cells[it.name] = {};
      for (const g of groups) {
        const rows = byG.get(g);
        const vb = [], vc = {}, wb = [], wc = {};
        cfg.cips.forEach((c) => { vc[c] = []; wc[c] = []; });
        const wm = wiw.get(it.name);
        for (const r of rows) {
          const v = num(r[it.name]); if (v == null) continue;
          const c = cOf(r);
          const s = wm ? wm.get(r[cfg.waferCol]) : null;
          if (c === cfg.baseline) { vb.push(v); if (s != null) wb.push(s); } else if (vc[c]) { vc[c].push(v); if (s != null) wc[c].push(s); }
        }
        const b = App.stats(vb);
        cells[it.name][g] = {};
        for (const c of cfg.cips) {
          const s = App.stats(vc[c]);
          let k = null, reason = '';
          if (!s.n) reason = `${c} 無資料`;
          else if (!(b.n > 1)) reason = 'BSL 樣本不足';
          else if (!(b.sd > 0)) reason = 'BSL σ = 0';
          else k = (s.mean - b.mean) / b.sd;
          const cell = { item: it, group: g, cip: c, metric: it.metric, k, n: s.n || 0, mean: s.mean, sd: s.sd, bn: b.n || 0, bmean: b.mean, bsd: b.sd,
            median: s.median, bmedian: b.median, reason, low: s.n > 0 && s.n < 5 };
          if (it.metric === 'fold') {
            const pc = vc[c].filter((x) => x > 0), pb = vb.filter((x) => x > 0);
            const mc = median(pc), mb = median(pb);
            if (mc != null && mb > 0) {
              cell.fold = mc / mb; cell.reason = '';
              cell.dir = Math.sign(Math.log(cell.fold));
              cell.level = lv(Math.max(cell.fold, 1 / cell.fold), th.fG, th.fO);
              cell.text = `×${cell.fold >= 10 ? cell.fold.toFixed(1) : cell.fold.toFixed(2)}`;
            } else { cell.level = 'na'; cell.reason = reason || '無正值資料'; }
          } else if (it.metric === 'rate') {
            const tol = Math.max(1e-6, Math.abs(it.target) * 0.005);
            const fail = (a) => a.filter((x) => Math.abs(x - it.target) > tol).length;
            if (s.n && b.n) {
              cell.rateC = fail(vc[c]) / s.n; cell.rateB = fail(vb) / b.n; cell.reason = '';
              cell.diff = (cell.rateC - cell.rateB) * 100;
              cell.dir = Math.sign(cell.diff);
              cell.level = cell.diff <= th.rG ? 'green' : cell.diff <= th.rO ? 'yellow' : 'orange';
              cell.text = `異常 ${pct(cell.rateC)}`;
            } else { cell.level = 'na'; cell.reason = reason || 'BSL 無資料'; }
          } else {
            cell.dir = Math.sign(k || 0);
            cell.level = lv(k == null ? null : Math.abs(k), th.kG, th.kO);
            cell.text = `K ${fmtK(k)}`;
          }
          // variation (used by the inline module)
          if (s.n >= 3 && b.n >= 3 && b.sd > 0) { cell.sdRatio = s.sd / b.sd; cell.sdLevel = cell.sdRatio <= 1 ? 'green' : lv(cell.sdRatio, th.sG, th.sO); }
          if (wc[c].length >= 2 && wb.length >= 2) {
            const mw = App.stats(wc[c]).mean, mbw = App.stats(wb).mean;
            if (mbw > 0) { cell.wiwRatio = mw / mbw; cell.wiwLevel = cell.wiwRatio <= 1 ? 'green' : lv(cell.wiwRatio, th.sG, th.sO); cell.wiwC = mw; cell.wiwB = mbw; }
          }
          cell.varLevel = E.worse(cell.sdLevel || 'na', cell.wiwLevel || 'na');
          cells[it.name][g][c] = cell;
        }
      }
    }
    // ---------------- findings per module
    const isAbn = (l) => l === 'orange' || l === 'yellow';
    const sev = (f) => (f.cell.level === 'orange' || f.varLevel === 'orange' ? 2 : 1) * 100 + (f.score || 0);
    const findings = { wat: [], inline: [], yield: [] };
    for (const it of items) for (const g of groups) for (const c of cfg.cips) {
      const cell = cells[it.name][g][c];
      const score = cell.metric === 'fold' ? Math.abs(Math.log2(cell.fold || 1)) * 2 : cell.metric === 'rate' ? Math.abs(cell.diff || 0) / 3 : Math.abs(cell.k || 0);
      if (it.kind === 'wat' && isAbn(cell.level)) {
        // r per wafer; not meaningful for a pass／fail rate item (SPA): leave null → judged by K only
        const rr = (name) => (RU().metricOf(it.cat) === 'rate' ? null : E.pearson(byG.get(g) || [], it.name, name, RU().metricOf(it.cat) === 'fold'));
        const rel = RU().relatedInline(it.name, it.cat, items).map((r) => ({ ...r, k: cells[r.item.name]?.[g]?.[c]?.k, r: rr(r.item.name) }));
        const xrel = (RU().relatedXLayer ? RU().relatedXLayer(it.name, it.cat, items) : []).map((r) => ({ ...r, k: cells[r.item.name]?.[g]?.[c]?.k, r: rr(r.item.name) }));
        findings.wat.push({ type: 'mean', cell, rel, xrel, score, dx: RU().diagnose(cell, rel, xrel) });
      }
      if (it.kind === 'yield' && isAbn(cell.level)) {
        // cross-reference: abnormal WAT cells of the same group / CIP
        const yBad = RU().byId(it.cat).bad === 'down' ? 1 : -1;
        const rel = items.filter((w) => w.kind === 'wat').map((w) => ({ item: w, cell: cells[w.name]?.[g]?.[c], sign: yBad * (RU().byId(w.cat).bad === 'down' ? 1 : -1) })).filter((r) => r.cell && isAbn(r.cell.level));
        findings.yield.push({ type: 'mean', cell, rel, score, dx: RU().diagnoseYield(cell, rel) });
      }
      if (it.kind === 'inline') {
        if (isAbn(cell.level)) {
          const rel = RU().relatedWat(it.name, it.cat, items).map((r) => ({ ...r, cell: cells[r.item.name]?.[g]?.[c] }));
          findings.inline.push({ type: 'mean', cell, rel, score, dx: RU().diagnoseInline(cell, rel) });
        }
        const which = RANK[cell.wiwLevel || 'na'] >= RANK[cell.sdLevel || 'na'] ? 'wiw' : 'w2w';
        const vl = which === 'wiw' ? cell.wiwLevel : cell.sdLevel;
        if (isAbn(vl)) findings.inline.push({ type: 'var', which, cell, varLevel: vl, score: ((which === 'wiw' ? cell.wiwRatio : cell.sdRatio) - 1) * 3, dx: RU().diagnoseVar(cell, which) });
      }
    }
    // v3.2: one HL per cell — a mean finding and a variation finding of the same item / group / CIP are merged
    {
      const byCell = new Map();
      for (const f of findings.inline) { const k = `${f.cell.item.name}|${f.cell.group}|${f.cell.cip}`; if (!byCell.has(k)) byCell.set(k, []); byCell.get(k).push(f); }
      findings.inline = [...byCell.values()].map((arr) => {
        if (arr.length < 2) return arr[0];
        const m = arr.find((f) => f.type === 'mean'), v = arr.find((f) => f.type === 'var');
        const vt = `${v.which === 'wiw' ? '片內 σ' : 'wafer 間 σ'} ×${(v.which === 'wiw' ? v.cell.wiwRatio : v.cell.sdRatio).toFixed(2)}`;
        return { ...m, varOf: v, varLevel: v.varLevel, which: v.which, score: m.score + v.score,
          dx: { ...m.dx, title: `${m.dx.title}，${vt}`, verdict: `${m.dx.verdict}${v.dx.verdict ? ` ${v.dx.verdict}` : ''}`, checks: [...new Set([...(m.dx.checks || []), ...(v.dx.checks || [])])], causes: [...new Set([...(m.dx.causes || []), ...(v.dx.causes || [])])] } };
      });
    }
    const lvOf = (f) => (f.type === 'var' ? f.varLevel : f.varOf ? (RANK[f.varLevel] > RANK[f.cell.level] ? f.varLevel : f.cell.level) : f.cell.level);
    for (const k of E.KINDS) findings[k].sort((a, b) => RANK[lvOf(b)] - RANK[lvOf(a)] || b.score - a.score);
    // ---------------- counts & data quality per module
    const cnt = {}, naList = {};
    for (const kind of E.KINDS) {
      cnt[kind] = { green: 0, yellow: 0, orange: 0, na: 0 }; naList[kind] = [];
      for (const it of items.filter((i) => i.kind === kind)) for (const g of groups) for (const c of cfg.cips) {
        const cell = cells[it.name][g][c]; cnt[kind][cell.level]++;
        if (cell.level === 'na') naList[kind].push(cell);
      }
    }
    const varCnt = { green: 0, yellow: 0, orange: 0, na: 0 };
    for (const it of items.filter((i) => i.kind === 'inline')) for (const g of groups) for (const c of cfg.cips) varCnt[cells[it.name][g][c].varLevel]++;
    const dates = cfg.dateCol ? ds.rows.map((r) => r[cfg.dateCol]).filter((d) => d instanceof Date).sort((a, b) => a - b) : [];
    const nWafer = { [cfg.baseline]: 0 }; cfg.cips.forEach((c) => (nWafer[c] = 0));
    ds.rows.forEach((r) => { const c = cOf(r); if (c in nWafer) nWafer[c]++; });
    return { th, items, groups, cells, findings, cnt, varCnt, naList, hasWiw: wiw.size > 0, dateRange: dates.length ? [dates[0], dates[dates.length - 1]] : null, nWafer, gOf, cOf, byG, lvOf };
  };



  // ------------------------------------------------------------------ v3.2 data pre-processing: duplicates, unit mismatch, extreme outliers
  E.prepDefault = () => ({ dup: 'keep', scale: {}, excl: new Set(), ack: false });
  /** duplicated wafer ids (by-wafer table) and unit-scale suspicion, on the data as loaded */
  E.prepScanBase = (ds, cfg) => {
    const items = cfg.items.filter((i) => i.on), w = cfg.waferCol, rows = ds.rows;
    const byW = new Map();
    rows.forEach((r, i) => { const k = r[w]; if (k == null || k === '') return; if (!byW.has(k)) byW.set(k, []); byW.get(k).push(i); });
    const dups = [...byW].filter(([, a]) => a.length > 1).map(([k, a]) => ({ wafer: k, n: a.length, idx: a,
      diff: items.filter((it) => new Set(a.map((i) => num(rows[i][it.name])).filter((v) => v != null)).size > 1).map((it) => it.name) }));
    const units = [];
    const cOf = (r) => E.cat(r[cfg.condCol]);
    for (const it of items) {
      const vb = rows.filter((r) => cOf(r) === cfg.baseline).map((r) => num(r[it.name])).filter((v) => v != null);
      const sb = App.stats(vb), mb = median(vb.filter((v) => v > 0));
      for (const c of cfg.cips) {
        const vc = rows.filter((r) => cOf(r) === c).map((r) => num(r[it.name])).filter((v) => v != null);
        if (vc.length < 3 || vb.length < 3) continue;
        const sc = App.stats(vc), mc = median(vc.filter((v) => v > 0));
        let factor = null, ratio = null;
        if (mb > 0 && mc > 0) { ratio = mc / mb; const lr = Math.log10(ratio), n = Math.round(lr); if (n !== 0 && Math.abs(lr - n) < 0.08) factor = 10 ** -n; }
        const k = sb.sd > 0 ? Math.abs(sc.mean - sb.mean) / sb.sd : null;
        if (factor != null || (k != null && k > 20)) units.push({ item: it.name, cond: c, ratio, factor, k, medB: mb, medC: mc });
      }
    }
    return { dups, units };
  };
  /** extreme outliers per item within each group × condition population: modified z (MAD) > 6, IQR ×3 fallback; log scale for fold items */
  E.prepScanOutliers = (ds, cfg, excl) => {
    const items = cfg.items.filter((i) => i.on), w = cfg.waferCol, rows = ds.rows;
    const gOf = (r) => (cfg.groupCol ? E.cat(r[cfg.groupCol]) : '全部'), cOf = (r) => E.cat(r[cfg.condCol]);
    const out = [];
    for (const it of items) {
      const pops = new Map();
      rows.forEach((r, i) => { let v = num(r[it.name]); if (v == null) return; if (it.metric === 'fold') { if (v <= 0) return; v = Math.log10(v); } const k = `${gOf(r)}|${cOf(r)}`; if (!pops.has(k)) pops.set(k, []); pops.get(k).push({ i, v }); });
      const flagged = [], tails = [];
      for (const [k, a] of pops) {
        if (a.length < 8) continue;
        const vals = a.map((x) => x.v), med = median(vals), mad = median(vals.map((v) => Math.abs(v - med)));
        let test;
        if (mad > 0) test = (v) => { const z = (0.6745 * (v - med)) / mad; return Math.abs(z) > 6 ? z : null; };
        else { const st = App.stats(vals), iqr = st.q3 - st.q1; if (!(iqr > 0)) continue; test = (v) => (v < st.q1 - 3 * iqr || v > st.q3 + 3 * iqr ? (v - med) / Math.max(iqr, 1e-12) : null); }
        const hits = [];
        for (const x of a) { const z = test(x.v); if (z != null) { const r = rows[x.i]; hits.push({ wafer: r[w], group: gOf(r), cond: cOf(r), value: num(r[it.name]), z, excluded: excl?.has(`${r[w]}|${it.name}`) || false }); } }
        // many points past the fence = a tail or a cluster (campaign, bimodal), not isolated outliers → noted, not flagged
        if (hits.length > Math.max(3, Math.round(0.005 * a.length))) { tails.push(`${k.replace('|', ' × ')}：${hits.length} 點集中在尾端，比較像真實分布而不是離群，未列入`); continue; }
        flagged.push(...hits);
      }
      if (flagged.length || tails.length) out.push({ item: it.name, rows: flagged.sort((p, q) => Math.abs(q.z) - Math.abs(p.z)), tails });
    }
    return out;
  };
  /** apply the user's pre-processing choices: duplicate handling → unit scaling → point exclusions */
  E.applyPrep = (ds, cfg, prep, stage = 'all') => {
    const items = cfg.items.filter((i) => i.on), w = cfg.waferCol;
    let rows = ds.rows;
    if (prep.dup && prep.dup !== 'keep') {
      const byW = new Map(), order = [];
      for (const r of rows) { const k = r[w]; if (k == null || k === '') { order.push([null, [r]]); continue; } if (!byW.has(k)) { byW.set(k, []); order.push([k, byW.get(k)]); } byW.get(k).push(r); }
      rows = [];
      for (const [k, a] of order) {
        if (a.length === 1 || k == null) { rows.push(a[0]); continue; }
        if (prep.dup === 'drop') continue;
        if (prep.dup === 'first') { rows.push(a[0]); continue; }
        const o = { ...a[0] };
        for (const it of items) { const v = a.map((r) => num(r[it.name])).filter((x) => x != null); o[it.name] = v.length ? v.reduce((p, q) => p + q, 0) / v.length : null; }
        rows.push(o);
      }
    }
    const sc = prep.scale || {};
    if (Object.keys(sc).length) rows = rows.map((r) => { let o = r; const c = E.cat(r[cfg.condCol]); for (const it in sc) { const f = sc[it]?.[c]; if (f != null && f !== 1 && num(r[it]) != null) { if (o === r) o = { ...r }; o[it] = r[it] * f; } } return o; });
    if (stage === 'all' && prep.excl && prep.excl.size) rows = rows.map((r) => { let o = r; for (const it of items) if (prep.excl.has(`${r[w]}|${it.name}`)) { if (o === r) o = { ...r }; o[it.name] = null; } return o; });
    return { ...ds, rows };
  };

  // ------------------------------------------------------------------ data layer: link a second table by wafer id
  /** canonical wafer key: "UAB123.01" / "uab123-1" / "UAB123#01" → "UAB123.01"; otherwise trimmed upper-case */
  E.waferKey = (v) => {
    if (v == null) return null;
    const s = String(v).trim().toUpperCase();
    const m = s.match(/^(.+?)[.\-_#\s]+(\d{1,2})$/);
    return m ? `${m[1]}.${m[2].padStart(2, '0')}` : s;
  };
  /** pick the column of `ds` whose values best match the main wafer keys */
  E.findWaferCol = (ds, mainKeys) => {
    let best = null, bestHit = 0;
    for (const c of ds.columns) {
      if (c.type !== 'text' && c.type !== 'number') continue;
      let hit = 0, n = 0;
      for (const r of ds.rows.slice(0, 2000)) { const k = E.waferKey(r[c.name]); if (k == null || k === '') continue; n++; if (mainKeys.has(k)) hit++; }
      if (n && hit > bestHit) { best = c.name; bestHit = hit; }
    }
    return bestHit ? best : null;
  };
  /**
   * Collapse a linked table to one row per wafer.
   *   - long tool history (wafer × step × tool): columns matching step / tool are pivoted → "<step> <toolCol>" = tool (last pass wins)
   *   - otherwise numbers → mean, text → last non-empty
   */
  E.collapseLinked = (ds, waferCol) => {
    const stepCol = ds.columns.find((c) => c.type === 'text' && c.name !== waferCol && /step|stage|station|oper|站點|站別|製程/i.test(c.name));
    const toolCols = ds.columns.filter((c) => c.type === 'text' && c.name !== waferCol && c !== stepCol && /tool|eqp|equip|chamber|ch\b|machine|機台|腔/i.test(c.name));
    const timeCol = ds.columns.find((c) => c.type === 'datetime');
    const dup = E.dupRatio(ds, waferCol) > 1.05;
    const rows = ds.rows.slice();
    if (timeCol) rows.sort((a, b) => (a[timeCol.name] || 0) - (b[timeCol.name] || 0));
    const M = new Map();
    const cols = [];
    const addCol = (name, type) => { if (!cols.some((c) => c.name === name)) cols.push({ name, type, role: 'measure' }); };
    if (dup && stepCol && toolCols.length) {       // pivot long tool history
      for (const r of rows) {
        const k = E.waferKey(r[waferCol]); if (!k) continue;
        if (!M.has(k)) M.set(k, {});
        const o = M.get(k), st = E.cat(r[stepCol.name]);
        for (const tc of toolCols) { const v = r[tc.name]; if (v == null || v === '') continue; const name = `${st} ${tc.name}`; o[name] = v; addCol(name, 'text'); }
        if (timeCol) { const name = `${st} ${timeCol.name}`; o[name] = r[timeCol.name]; addCol(name, 'datetime'); }
      }
      return { rows: [...M.entries()].map(([k, o]) => ({ __key: k, ...o })), columns: cols, pivoted: true, stepCol: stepCol.name, toolCols: toolCols.map((c) => c.name) };
    }
    for (const r of rows) {
      const k = E.waferKey(r[waferCol]); if (!k) continue;
      if (!M.has(k)) M.set(k, { sum: {}, n: {}, v: {} });
      const o = M.get(k);
      for (const c of ds.columns) {
        if (c.name === waferCol) continue;
        const v = r[c.name]; if (v == null || v === '') continue;
        if (c.type === 'number' && typeof v === 'number') { o.sum[c.name] = (o.sum[c.name] || 0) + v; o.n[c.name] = (o.n[c.name] || 0) + 1; } else o.v[c.name] = v;
        addCol(c.name, c.type);
      }
    }
    const out = [...M.entries()].map(([k, o]) => { const row = { __key: k }; for (const c of cols) row[c.name] = c.type === 'number' ? (o.n[c.name] ? o.sum[c.name] / o.n[c.name] : null) : o.v[c.name] ?? null; return row; });
    return { rows: out, columns: cols, pivoted: false, collapsed: dup };
  };
  /** join collapsed table into the main wafer table (in place); returns the link report */
  E.linkInto = (main, waferCol, linked, label) => {
    const mainKeys = new Map(); main.rows.forEach((r) => { const k = E.waferKey(r[waferCol]); if (k) mainKeys.set(k, r); });
    const used = new Set(main.columns.map((c) => c.name));
    const rename = {}; linked.columns.forEach((c) => { let n = c.name, i = 2; while (used.has(n)) n = `${c.name}·${i++}`; rename[c.name] = n; used.add(n); });
    let matched = 0, extra = 0;
    for (const lr of linked.rows) { const mr = mainKeys.get(lr.__key); if (!mr) { extra++; continue; } matched++; for (const c of linked.columns) mr[rename[c.name]] = lr[c.name]; }
    const added = linked.columns.map((c) => ({ name: rename[c.name], type: c.type, role: 'measure', linked: label }));
    main.columns.push(...added);
    main.rows.forEach((r) => { for (const c of added) if (!(c.name in r)) r[c.name] = null; });
    return { label, matched, mainWafers: mainKeys.size, linkedWafers: linked.rows.length, extra, rate: mainKeys.size ? matched / mainKeys.size : 0, columns: added.map((c) => c.name) };
  };

  // ------------------------------------------------------------------ commonality: scan categorical columns
  // regularized upper incomplete gamma Q(a, x) → chi-square survival function (Numerical Recipes gser / gcf)
  const gammaln = (x) => { const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5]; let y = x, t = x + 5.5; t -= (x + 0.5) * Math.log(t); let ser = 1.000000000190015; for (const cj of c) ser += cj / ++y; return -t + Math.log(2.5066282746310005 * ser / x); };
  const gammaQ = (a, x) => {
    if (x <= 0) return 1;
    if (x < a + 1) { let ap = a, sum = 1 / a, del = sum; for (let n = 1; n < 500; n++) { ap++; del *= x / ap; sum += del; if (Math.abs(del) < Math.abs(sum) * 1e-12) break; } return 1 - sum * Math.exp(-x + a * Math.log(x) - gammaln(a)); }
    let b = x + 1 - a, c = 1 / 1e-300, d = 1 / b, h = d;
    for (let i = 1; i < 500; i++) { const an = -i * (i - a); b += 2; d = an * d + b; if (Math.abs(d) < 1e-300) d = 1e-300; c = b + an / c; if (Math.abs(c) < 1e-300) c = 1e-300; d = 1 / d; const del = d * c; h *= del; if (Math.abs(del - 1) < 1e-12) break; }
    return Math.exp(-x + a * Math.log(x) - gammaln(a)) * h;
  };
  E.chi2sf = (x, df) => gammaQ(df / 2, x / 2);
  /** Kruskal–Wallis H (tie-corrected) and p for groups: [[values], ...] */
  E.kruskal = (groups) => {
    const all = []; groups.forEach((g, gi) => g.forEach((v) => all.push({ v, gi })));
    const n = all.length, k = groups.length;
    if (k < 2 || n < 3) return { H: null, p: null, eps: null };
    all.sort((a, b) => a.v - b.v);
    let tieSum = 0;
    for (let i = 0; i < n;) { let j = i; while (j + 1 < n && all[j + 1].v === all[i].v) j++; const r = (i + j) / 2 + 1; for (let q = i; q <= j; q++) all[q].r = r; const t = j - i + 1; if (t > 1) tieSum += t * t * t - t; i = j + 1; }
    const R = groups.map(() => 0); all.forEach((a) => (R[a.gi] += a.r));
    let H = 0; groups.forEach((g, i) => { if (g.length) H += (R[i] * R[i]) / g.length; });
    H = (12 / (n * (n + 1))) * H - 3 * (n + 1);
    const corr = 1 - tieSum / (n * n * n - n); if (corr > 0) H /= corr;
    const p = E.chi2sf(H, k - 1), eps = Math.max(0, (H - k + 1) / (n - k));   // epsilon² effect size
    return { H, p, eps };
  };
  /** Benjamini–Hochberg adjusted p-values */
  E.bh = (ps) => { const idx = ps.map((p, i) => [p, i]).filter((x) => x[0] != null).sort((a, b) => a[0] - b[0]); const m = idx.length, out = ps.slice(); let prev = 1; for (let r = m - 1; r >= 0; r--) { const q = Math.min(prev, (idx[r][0] * m) / (r + 1)); out[idx[r][1]] = q; prev = q; } return out; };
  /**
   * Scan every categorical column of the data for one item @ group / cip.
   * Returns ranked factors: { col, levels:[{v, n, mean, k}], H, p, pAdj, eps, worst, confound, note }
   *   - test is Kruskal–Wallis across the CIP wafers' levels (≥ 2 levels with n ≥ 3 each)
   *   - k per level = (level mean − BSL mean) / σ_BSL, so levels can be read like the light table
   *   - confound: the column's levels line up with the condition (every level belongs to one condition only)
   */
  /** per-level stats of one item for CIP rows split by keyFn (string level or null); BSL counts for run-rate */
  E.factorLevels = (cRows, bRows, itemName, cell, keyFn, th) => {
    const lv = new Map(), bCnt = new Map();
    for (const r of cRows) { const k = keyFn(r); if (k == null) continue; if (!lv.has(k)) lv.set(k, []); lv.get(k).push(r[itemName]); }
    for (const r of bRows) { const k = keyFn(r); if (k == null) continue; bCnt.set(k, (bCnt.get(k) || 0) + 1); }
    const nB = [...bCnt.values()].reduce((a, b) => a + b, 0), nC = [...lv.values()].reduce((a, b) => a + b.length, 0);
    const keys = new Set([...lv.keys(), ...bCnt.keys()]);
    const levels = [...keys].map((v) => { const a = lv.get(v) || [], st = a.length ? App.stats(a) : { n: 0, mean: null, sd: null }; return { v, n: st.n, mean: st.mean, sd: st.sd, k: st.n && cell.bsd > 0 ? (st.mean - cell.bmean) / cell.bsd : null, nB: bCnt.get(v) || 0, shareB: nB ? (bCnt.get(v) || 0) / nB : 0, shareC: nC ? st.n / nC : 0 }; })
      .sort((a, b) => (b.k ?? -1e9) - (a.k ?? -1e9));
    const tested = levels.filter((l) => l.n >= 3);
    let H = null, p = null, eps = null, spread = null;
    if (tested.length >= 2) { ({ H, p, eps } = E.kruskal(tested.map((l) => lv.get(l.v)))); const ks = tested.map((l) => l.k).filter((k) => k != null); spread = ks.length ? Math.max(...ks) - Math.min(...ks) : null; }
    const withData = levels.filter((l) => l.n > 0);
    const worst = withData.length ? (cell.dir >= 0 ? withData[0] : withData[withData.length - 1]) : null;
    return { levels, tested, H, p, eps, spread, worst, nLevels: withData.length, nB, nC };
  };
  /**
   * Scan every categorical column of the data for one item @ group / cip.
   * Returns ranked factors: { col, levels, H, p, pAdj, eps, spread, worst, confound, hit, note }
   *   - Kruskal–Wallis across the CIP wafers' levels (≥ 2 levels with n ≥ 3 each); p adjusted with Benjamini–Hochberg
   *   - k per level = (level mean − BSL mean) / σ_BSL; spread = difference between the best and worst level (σ)
   *   - hit: pAdj < 0.1, ε² ≥ 0.1 and the levels differ by ≥ 0.5σ and by ≥ 20% of the cell's shift (a tool must explain a real part of it)
   *   - confound: the column's levels line up with the condition (every level belongs to one condition only)
   */
  E.scanFactors = (ds, cfg, itemName, group, cip, cell) => {
    const skip = new Set([cfg.waferCol, cfg.lotCol, cfg.condCol, cfg.groupCol].filter(Boolean));
    const rowsG = (cfg.groupCol ? ds.rows.filter((r) => E.cat(r[cfg.groupCol]) === group) : ds.rows).filter((r) => num(r[itemName]) != null);
    const cRows = rowsG.filter((r) => E.cat(r[cfg.condCol]) === cip), bRows = rowsG.filter((r) => E.cat(r[cfg.condCol]) === cfg.baseline);
    const out = [];
    // layer relevance of a tool column to this item (v3.3): same layer first; a column of another layer is scanned but marked off-layer
    const Li = RU().layer(itemName);
    const parseL = (L) => { const m = (L || '').match(/^(TM|TV|M|V)(\d+)$/i); return m ? { kind: m[1].toUpperCase().endsWith('V') ? 'V' : 'M', top: m[1].toUpperCase().startsWith('T'), n: +m[2] } : null; };
    // adjacent = the via directly below / above a metal (V n-1, V n ↔ M n) within the same stack (TM/TV vs M/V)
    const idx = (L) => { const q = parseL(L); return q ? { top: q.top, i: q.n * 2 + (q.kind === 'V' ? 1 : 0) } : null; };   // M n → 2n, V n → 2n+1: neighbours are within 2 steps (V n-1, M n-1, V n, M n+1)
    const layerRel = (col) => { const Lc = RU().layer(col); if (!Lc || !Li) return 'any'; if (Lc === Li) return 'same'; const a = idx(Li), b = idx(Lc); if (!a || !b || a.top !== b.top) return 'off'; const dd = Math.abs(a.i - b.i); return dd === 1 || (dd === 2 && a.i % 2 === 0 && b.i % 2 === 0) ? 'adj' : 'off'; };   // via ↔ its two metals; metal ↔ metal one level down/up (CMP topography)
    for (const c of E.factorColumns(ds, cfg)) {
      const keyFn = (r) => { const v = r[c.name]; return v == null || v === '' ? null : E.cat(v); };
      const st = E.factorLevels(cRows, bRows, itemName, cell, keyFn);
      if (st.nLevels < 1 || st.nLevels > 40) continue;
      const cross = new Map();
      for (const r of rowsG) { const k = keyFn(r); if (k == null) continue; if (!cross.has(k)) cross.set(k, new Set()); cross.get(k).add(E.cat(r[cfg.condCol])); }
      // confounded for THIS cip: every level the CIP wafers ran on has no BSL wafer (v3.2: judged per CIP, not over all conditions)
      const cipLv = st.levels.filter((l) => l.n > 0);
      const confound = (cipLv.length > 0 && cipLv.every((l) => l.nB === 0)) || ([...cross.values()].every((set) => set.size === 1) && cross.size > 1);
      let note = '';
      if (confound) note = `CIP 走的 ${cipLv.map((l) => l.v).join('／')} 沒有 BSL wafer 可對照：機台與條件混淆，無法分辨`;
      else if (st.tested.length < 2) note = st.nLevels === 1 ? `CIP 全部走 ${st.worst.v}（只有一個 level，無法比較）` : '每個 level 的 wafer 少於 3 片';
      out.push({ col: c.name, ...st, confound, note, layerRel: layerRel(c.name), colLayer: RU().layer(c.name) });
    }
    const adj = E.bh(out.map((o) => o.p));
    out.forEach((o, i) => { o.pAdj = adj[i]; o.hit = !o.confound && o.pAdj != null && o.pAdj < 0.1 && o.eps >= 0.1 && o.spread != null && o.spread >= 0.5 && o.spread >= 0.2 * Math.abs(cell.k ?? 0); if (!o.hit && !o.note && o.pAdj != null && o.pAdj < 0.1 && o.spread != null) o.note = `各 level 差 ${o.spread.toFixed(2)}σ，相對整體偏移不大 → 比較像條件本身的差異`; if (o.layerRel === 'off') o.note = `${o.colLayer} 層機台，非本層${Li ? ` ${Li}` : ''}${o.note ? '；' + o.note : ''}`; });
    const REL = { same: 0, any: 1, adj: 2, off: 3 };
    out.sort((a, b) => (b.hit - a.hit) || REL[a.layerRel] - REL[b.layerRel] || (b.eps ?? -1) - (a.eps ?? -1) || (a.pAdj ?? 2) - (b.pAdj ?? 2));
    out.itemLayer = Li; out.offOnly = out.length > 0 && out.every((o) => o.layerRel === 'off');
    return out;
  };
  /** categorical columns usable as factors (tool, chamber, route…): text, not key / condition / group / time columns */
  E.factorColumns = (ds, cfg) => {
    const skip = new Set([cfg.waferCol, cfg.lotCol, cfg.condCol, cfg.groupCol].filter(Boolean));
    return ds.columns.filter((c) => c.type === 'text' && !skip.has(c.name) && !/時間|time|date/i.test(c.name));
  };

  /** plain-text summary (for e-mail / chat) for one module */
  /** Pearson r between two columns over rows (both numeric; y optionally log10 for LK-type items); null when n < 4 */
  E.pearson = (rows, y, x, logY = false) => {
    let n = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
    for (const q of rows) {
      let a = num(q[x]), b = num(q[y]); if (a == null || b == null) continue;
      if (logY) { if (b <= 0) continue; b = Math.log10(b); }
      n++; sx += a; sy += b; sxx += a * a; syy += b * b; sxy += a * b;
    }
    if (n < 4) return null;
    const d = Math.sqrt((n * sxx - sx * sx) * (n * syy - sy * sy));
    return d > 0 ? (n * sxy - sx * sy) / d : null;
  };
  /** data-quality lines with the same item / same cause merged: "CIP-C 在 P2 沒有 wafer", "Rc_V1 @ G1：BSL σ = 0" */
  E.dataQualityLines = (res, cfg, mode) => {
    const na = res.naList[mode], out = [], used = new Set();
    const nItems = res.items.filter((i) => i.kind === mode).length, multiG = res.groups.length > 1;
    for (const g of res.groups) for (const c of cfg.cips) {
      const hit = na.filter((x) => x.group === g && x.cip === c && x.reason === `${c} 無資料`);
      if (nItems > 1 && hit.length === nItems) { out.push(`${c}${multiG ? ` 在 ${g}` : ''} 沒有 wafer`); hit.forEach((x) => used.add(x)); }
    }
    const rest = na.filter((x) => !used.has(x)), byKey = new Map();
    for (const x of rest) { const k = `${RU().parseName(x.item.name).short}${multiG ? ` @ ${x.group}` : ''}：${x.reason}`; if (!byKey.has(k)) byKey.set(k, 0); byKey.set(k, byKey.get(k) + 1); }
    for (const [k, n] of byKey) out.push(n > 1 && !/無資料/.test(k) ? k : k);
    return out;
  };
  E.summaryText = (res, cfg, meta, mode = 'wat') => {
    const L = [], th = res.th;
    const f4 = (v) => (typeof v === 'number' && isFinite(v) ? (Math.abs(v) < 1e-3 && v !== 0 ? v.toExponential(3) : String(+v.toPrecision(4))) : '—');
    const cnt = res.cnt[mode], fs = res.findings[mode];
    L.push(`【BEOL ${E.MOD[mode] || mode} 戰報】${cfg.cips.join('、')}（CIP） vs ${cfg.baseline}（BSL）${meta?.file ? `　資料：${meta.file}` : ''}`);
    if (res.dateRange) L.push(`期間：${App.fmtDate(res.dateRange[0]).slice(0, 10)} ～ ${App.fmtDate(res.dateRange[1]).slice(0, 10)}　wafer 數：${Object.entries(res.nWafer).map(([c, n]) => `${c} ${n}`).join('、')}`);
    L.push(mode === 'wat'
      ? `燈號：一般 item 綠 ≤ ${th.kG}σ、橘 > ${th.kO}σ；LK 綠 ≤ ×${th.fG}、橘 > ×${th.fO}；SPA 異常率比 BSL 多 綠 ≤ ${th.rG}%、橘 > ${th.rO}%`
      : mode === 'inline' ? `燈號：均值 綠 ≤ ${th.kG}σ、橘 > ${th.kO}σ；變異 σ 倍數 綠 ≤ ×${th.sG}、橘 > ×${th.sO}`
      : `燈號：K 綠 ≤ ${th.kG}σ、橘 > ${th.kO}σ（yield 以 wafer 為單位）`);
    L.push(`結果：綠 ${cnt.green}、黃 ${cnt.yellow}、橘 ${cnt.orange}${cnt.na ? `、無法判定 ${cnt.na}` : ''}${mode === 'inline' ? `；變異異常 ${res.varCnt.orange + res.varCnt.yellow}` : ''}`);
    if (!fs.length) L.push('結論：全部在綠燈範圍內，CIP 與 BSL match。');
    // v3.2: a check sentence that every HL repeats is printed once at the end; an explanatory sentence (what 片內 σ means) once only
    const ckOf = fs.map((f) => (meta?.checks ? meta.checks(f) : f.dx.checks).slice());
    const common = fs.length > 1 ? ckOf[0].filter((t) => ckOf.every((a) => a.includes(t))) : [];
    const seenExpl = new Set();
    fs.forEach((f, i) => {
      const c = f.cell;
      L.push(`${i + 1}. ${f.dx.title}`);
      if (f.type === 'mean') {
        if (c.metric === 'rate') L.push(`   異常率 ${E.pct(c.rateC)} vs BSL ${E.pct(c.rateB)}（固定值 ${c.item.target}，N ${c.n} / ${c.bn}）`);
        else if (c.metric === 'fold') L.push(`   median ${f4(c.median)} vs BSL ${f4(c.bmedian)}（N ${c.n} / ${c.bn}）`);
        else L.push(`   ${c.cip} mean ${f4(c.mean)} vs BSL ${f4(c.bmean)}（N ${c.n} / ${c.bn}）`);
      }
      const expl = /σ 是/.test(f.dx.verdict || '');
      if (!expl) L.push(`   ${f.dx.verdict}`);
      else if (!seenExpl.has(f.which)) { seenExpl.add(f.which); L.push(`   ${f.dx.verdict}`); }
      if (meta?.factor) { const fv = meta.factor(f); if (fv) L.push(`   ${fv}`); }
      const own = ckOf[i].filter((t) => !common.includes(t));
      if (own.length) L.push(`   建議檢查：${own.join('；')}`);
      if (meta?.causes) { const cz = meta.causes(f); if (cz.length) L.push(`   物理機制（依證據）：${cz.join('、')}`); }
    });
    if (common.length) L.push(`建議檢查（全部 HL 共同）：${common.join('；')}`);
    if (meta?.kbOn) L.push(RU().kbVersion());
    const dq = E.dataQualityLines(res, cfg, mode);
    if (dq.length) L.push(`資料品質：${dq.join('；')}`);
    return L.join('\n');
  };
})();

</script>
<script>/* report/app.js */
/* app.js — BEOL 分析戰報 UI
 *   module switch (WAT / Inline / Yield) → setup → dashboard report (overview lights + HL master-detail)
 *   → trend matrix → correlation → floating chart windows → export (one-page HTML / PPT)
 */
(function () {
  'use strict';
  const App = window.App;
  const E = App.rptEngine, RU = App.rules;
  const S = (App.rpt = { file: '', src: null, dsRaw: null, ds: null, siteDs: [], links: [], cfg: null, res: null, siteLevel: false, grain: 'wafer', mode: 'wat',
    hl: { wat: 0, inline: 0 }, ov: 'mean', dens: 'auto', rowf: { abn: false, layers: [] }, hlf: { lv: 'all', group: '' }, collapsed: new Set(), trend: { mode: 'abn', x: 'seq', by: '' }, corr: { y: null, x: null, group: '全部' } });
  App.VERSION = '3.3';

  // ================================================================ data layer: link a second file by wafer id
  async function linkFile(file) {
    if (!S.dsRaw || !S.cfg?.waferCol) { App.toast('請先匯入主要資料', 'err'); return; }
    try {
      const t0 = performance.now();
      const wb = await App.importer.readFile(file);
      const src = App.importer.createSource(file, wb);
      App.state.datasets = [];
      const { datasets } = App.transform.buildDatasets(src);
      const ds = src.format === 'long' ? (datasets.find((d) => d.kind === 'wafer') || datasets[0]) : datasets[0];   // wide: the table as-is (one or many rows per wafer)
      const mainKeys = new Set(S.dsRaw.rows.map((r) => E.waferKey(r[S.cfg.waferCol])).filter(Boolean));
      const wc = E.findWaferCol(ds, mainKeys);
      if (!wc) { App.toast(`${file.name}：找不到與主檔 wafer id 對應的欄位（主檔格式如 ${esc([...mainKeys][0] || '')}）`, 'err'); return; }
      const col = E.collapseLinked(ds, wc);
      if (!col.columns.length) { App.toast(`${file.name}：除了 wafer id 之外沒有可連結的欄位`, 'err'); return; }
      const rep = E.linkInto(S.dsRaw, S.cfg.waferCol, col, file.name);
      rep.waferCol = wc; rep.pivoted = col.pivoted; rep.collapsed = col.collapsed; rep.rows = ds.rows.length;
      S.links.push(rep);
      // new numeric columns become items (classified by the knowledge base); text columns feed the factor scan
      for (const name of rep.columns) {
        const c = S.dsRaw.columns.find((x) => x.name === name);
        if (c.type !== 'number') continue;
        const n = S.dsRaw.rows.filter((r) => num(r[name]) != null).length;
        if (new Set(S.dsRaw.rows.map((r) => r[name]).filter((v) => v != null)).size < 2) continue;
        const k = RU.classify(name);
        S.cfg.items.push(E.itemSetup({ name, cat: k.cat, conf: k.conf, on: true, n, linked: file.name }, S.dsRaw.rows));
      }
      applyGrain();
      const pct = Math.round(rep.rate * 100);
      App.toast(`已連結 ${file.name}：主檔 ${rep.mainWafers} 片中 ${rep.matched} 片對到（${pct}%），新增 ${rep.columns.length} 個欄位${rep.pivoted ? '（長表已依站點轉成寬表）' : rep.collapsed ? '（多列已壓成每片一列）' : ''}`, pct < 50 ? 'err' : 'ok');

    const toRow = (q) => (q.customdata ? { wafer: q.customdata[0], group: q.customdata[1], cond: q.customdata[2], value: q.customdata[3], z: null } : null);

  // ================================================================ light tables
  function cellTip(it, p, x) {
    if (x.level === 'na') return x.reason;
    const n = `N ${x.n} / BSL ${x.bn}${x.low ? '（CIP 少於 5 片）' : ''}`;
    if (x.metric === 'fold') return `${p} median ${f4(x.median)} vs BSL ${f4(x.bmedian)}　${n}`;
    if (x.metric === 'rate') return `${p} 異常 ${pct(x.rateC)} vs BSL ${pct(x.rateB)}（固定值 ${f4(it.target)}）　${n}`;
    return `${p} mean ${f4(x.mean)} vs BSL ${f4(x.bmean)}　${n}`;
  }
  /** ---- adaptive density of the overview table ----
   *  normal : one number per cell, 76 px cells
   *  compact: 11 px font, 56 px cells
   *  heat   : 40 px cells; green cells show colour only, abnormal cells show a short number (σ / × / %pt in the category row)
   *  'auto' picks the densest tier needed so that the table stays beside the HL pane (≈ 46% of the report width) */
  const CELLW = { normal: 78, compact: 58, heat: 42 };
  function pickDensity(kind) {
    if (S.dens !== 'auto') return S.dens;
    const ncol = S.res.groups.length * S.cfg.cips.length, nrow = S.res.items.filter((i) => i.kind === kind).length;
    const avail = Math.max(420, ($('report')?.clientWidth || innerWidth - 80) * 0.46 - 120);
    for (const t of ['normal', 'compact']) if (ncol * CELLW[t] <= avail && nrow <= (t === 'normal' ? 14 : 28)) return t;
    return 'heat';
  }
  const layersOf = (kind) => [...new Set(S.res.items.filter((i) => i.kind === kind).map((i) => RU.layer(i.name)).filter(Boolean))].sort(E.natCmp);
  const rowAbn = (it, view) => S.res.groups.some((g) => S.cfg.cips.some((p) => { const x = S.res.cells[it.name][g][p]; return isAbnL(view === 'var' ? x.varLevel : x.level); }));
  /** short number for heat cells: "+2.6", "×8.9", "+13" */
  const heatTxt = (x) => (x.level === 'na' ? '' : x.metric === 'fold' ? `×${x.fold < 10 ? x.fold.toFixed(1) : Math.round(x.fold)}` : x.metric === 'rate' ? `${x.diff >= 0 ? '+' : '−'}${Math.abs(x.diff).toFixed(Math.abs(x.diff) < 10 ? 1 : 0)}` : `${x.k >= 0 ? '+' : '−'}${Math.abs(x.k).toFixed(1)}`);
  /** light table: view 'mean' = shift number only; 'var' = W2W / WIW σ ratio */
  function lightTable(kind, view = 'mean', dens = 'normal') {
    const r = S.res, c = S.cfg;
    let items = r.items.filter((i) => i.kind === kind);
    if (!items.length) return '';
    if (S.rowf.abn) items = items.filter((it) => rowAbn(it, view));
    if (S.rowf.layers.length) items = items.filter((it) => S.rowf.layers.includes(RU.layer(it.name)));
    const multi = c.cips.length > 1, heat = dens === 'heat';
    const kl = { wat: 'WAT item', inline: 'Inline item', yield: 'Yield item' }[kind] || 'item';
    const head = c.groupCol
      ? `<tr><th>${kl}<span class="sub">${esc(c.groupCol)} →</span></th>${r.groups.map((g) => c.cips.map((p) => `<th>${esc(g)}${multi ? `<span class="sub">${esc(p)}</span>` : ''}</th>`).join('')).join('')}</tr>`
      : `<tr><th>${kl}<span class="sub">不分組</span></th>${c.cips.map((p) => `<th>${esc(p)}<span class="sub">vs ${esc(c.baseline)}</span></th>`).join('')}</tr>`;
    const byCat = new Map();
    [...items].sort((a, b) => (/^other/.test(a.cat) ? 1 : 0) - (/^other/.test(b.cat) ? 1 : 0)).forEach((it) => { if (!byCat.has(it.cat)) byCat.set(it.cat, []); byCat.get(it.cat).push(it); });
    const ncol = 1 + r.groups.length * c.cips.length;
    const colAbn = {}; r.groups.forEach((g) => c.cips.forEach((p) => (colAbn[`${g}|${p}`] = { y: 0, o: 0 })));
    let body = '';
    for (const [cat, its] of byCat) {
      const m = its[0].metric, open = !S.collapsed.has(`${kind}|${cat}`);
      const unitNote = view === 'var' ? '×' : m === 'fold' ? '×（median 倍數）' : m === 'rate' ? `%pt（固定值 ${f4(its[0].target)}）` : 'σ';
      const nAbn = its.filter((it) => rowAbn(it, view)).length;
      body += `<tr class="cat ${open ? '' : 'closed'}" data-cat="${esc(`${kind}|${cat}`)}" title="點一下收合／展開"><td colspan="${ncol}"><i class="tri">${open ? '▾' : '▸'}</i>${esc(RU.byId(cat).label)}<span>　${esc(unitNote)}</span>${!open ? `<span class="muted">　${its.length} 個 item${nAbn ? `，<b class="o">${nAbn} 個異常</b>` : ''}</span>` : ''}</td></tr>`;
      if (!open) {
        for (const it of its) for (const g of r.groups) for (const p of c.cips) { const x = r.cells[it.name][g][p], l = view === 'var' ? x.varLevel : x.level; if (l === 'orange') colAbn[`${g}|${p}`].o++; else if (l === 'yellow') colAbn[`${g}|${p}`].y++; }

            const part = (lab, v, lv) => (v == null ? '' : `<span class="vv ${lv}">${heat ? '' : `${lab} `}×${v.toFixed(heat ? 1 : 2)}</span>`);
            const b = heat ? (isAbnL(l) ? part('', Math.max(x.sdRatio || 0, x.wiwRatio || 0), l) : '') : part('W2W', x.sdRatio, x.sdLevel) + part('WIW', x.wiwRatio, x.wiwLevel);

    return `<table class="lt ${dens}"><thead>${head}</thead><tbody>${body}${foot}</tbody></table>`;
  }

  // ================================================================ plots
  const baseLayout = (h) => ({
    height: h, margin: { l: 52, r: 12, t: 28, b: 40 }, paper_bgcolor: '#fff', plot_bgcolor: '#fff',
    font: { family: 'Segoe UI, Microsoft JhengHei, Noto Sans TC, Arial', size: 11, color: '#1c2430' },
    xaxis: { gridcolor: '#eef1f5', linecolor: '#d5dbe3', automargin: true, tickfont: { size: 10, color: '#667085' } },
    yaxis: { gridcolor: '#eef1f5', linecolor: '#d5dbe3', automargin: true, tickfont: { size: 10, color: '#667085' }, exponentformat: 'e' },

  const CFG = { displaylogo: false, responsive: true, modeBarButtonsToRemove: ['lasso2d', 'select2d', 'toggleSpikelines'] };
  const sample = (arr, max) => (arr.length <= max ? arr : arr.filter((_, i) => i % Math.ceil(arr.length / max) === 0));
  const axTitle = (n, extra = '') => ({ text: `${short(n)}${unit(n) ? ` (${unit(n)})` : ''}${extra}`, font: { size: 10.5, color: '#667085' } });

  // ---- trend x-axis (v3.1): default = wafer order (one point per wafer, no stacking on same-day dates); user picks the ordering column and may plot its value on x
  /** candidate ordering columns: datetime columns, wafer / lot id, then numeric columns that look like a sequence */
  function orderCols() {

  /** x values for ordered rows: wafer sequence (default) or the ordering column's own value (date / number columns only) */

  }
  const trendXCtrl = () => `<span>X 軸</span><span class="chips"><span class="chip ${S.trend.x !== 'col' ? 'on' : ''}" data-x="seq">wafer 順序</span><span class="chip ${S.trend.x === 'col' ? 'on' : ''}" data-x="col" ${colType(orderBy()) === 'text' ? 'title="排序欄是文字，無法當 X 值" style="opacity:.45"' : ''}>欄位值</span></span>

  }

  /** Trend: BSL grey cloud + reference band (K: ±1σ/±2σ, fold: ×/÷ thresholds on log axis, rate: fixed value line), CIP coloured on top */
  function trendFig(itemName, group, h = 250, opts = {}) {
    const c = S.cfg, r = S.res, it = itemOf(itemName), th = r.th;
    const rows = (r.byG.get(group) || S.ds.rows).filter((x) => num(x[itemName]) != null && (!isLog(itemName) || x[itemName] > 0));
    const sorted = orderRows(rows), tx = trendX(sorted), useDate = tx.type === 'date';
    const pts = sorted.map((x, i) => ({ x: tx.xs[i], y: x[itemName], w: x[c.waferCol], c: r.cOf(x) }));
    const xs = pts.map((p) => p.x).filter((v) => v != null);
    const xmin = xs.length ? (useDate ? new Date(Math.min(...xs)) : Math.min(...xs)) : 0, xmax = xs.length ? (useDate ? new Date(Math.max(...xs)) : Math.max(...xs)) : 1;

      shapes.push({ type: 'line', xref: 'paper', x0: 0, x1: 1, y0: bm, y1: bm, line: { color: '#6b7684', width: 1.2, dash: 'dash' } });
    }
    const big = opts.big, mini = opts.mini;
    const bShow = sample(bsl, mini ? 700 : 1500);
    data.push({ type: 'scatter', mode: 'markers', name: `BSL ${c.baseline}（N ${bsl.length}）${it.metric === 'rate' && c0 ? `  異常 ${pct(c0.rateB)}` : ''}`, x: bShow.map((p) => p.x), y: bShow.map((p) => p.y), text: bShow.map((p) => p.w),
      marker: { color: bShow.map((p) => (isFail(p.y) ? '#4b5563' : BSLC)), size: big ? 6 : mini ? 3.5 : 4.5, opacity: 0.75 }, hovertemplate: '%{text}<br>%{y}<extra>BSL</extra>' });
    for (const p of c.cips) {
      const cp = pts.filter((q) => q.c === p);
      if (!cp.length) continue;
      const cell = r.cells[itemName]?.[group]?.[p];
      const lab = !cell || cell.level === 'na' ? '' : `  ${shiftTxt(cell)}`;
      data.push({ type: 'scatter', mode: 'markers', name: `CIP ${p}${lab}（N ${cp.length}）`, x: cp.map((q) => q.x), y: cp.map((q) => q.y), text: cp.map((q) => q.w),
        marker: { color: cipColor(p), size: cp.map((q) => (isFail(q.y) ? (big ? 11 : 8.5) : big ? 8 : mini ? 5 : 7)), symbol: cp.map((q) => (isFail(q.y) ? 'diamond' : 'circle')),
          line: { width: cp.map((q) => (isFail(q.y) ? 1.4 : 0.8)), color: cp.map((q) => (isFail(q.y) ? '#c2410c' : '#fff')) } },
        hovertemplate: `%{text}<br>%{y}<extra>${esc(p)}</extra>` });
      const cx = cp.map((q) => q.x).filter((v) => v != null), x0 = useDate ? new Date(Math.min(...cx)) : Math.min(...cx), x1 = useDate ? new Date(Math.max(...cx)) : Math.max(...cx);
      const ref = it.metric === 'fold' ? cell?.median : it.metric === 'rate' ? null : cell?.mean;

    if (mini) { L.showlegend = false; L.margin = { l: 46, r: 8, t: 8, b: 34 }; }
    if (mini) { L.xaxis.title = null; L.yaxis.title = null; L.margin = { l: 42, r: 6, t: 6, b: 24 }; L.xaxis.tickfont.size = 9; L.yaxis.tickfont.size = 9; L.xaxis.nticks = 4; L.yaxis.nticks = 5; }
    return { data, layout: L };
  }

  function waferInfo() {
    if (S._wInfo && S._wInfo.res === S.res) return S._wInfo.m;
    const m = new Map();
    for (const r of S.ds.rows) m.set(r[S.cfg.waferCol], { c: S.res.cOf(r), g: S.res.gOf(r) });
    S._wInfo = { res: S.res, m };
    return m;
  }
  function siteTableFor(name) {
    for (const d of S.siteDs || []) {
      if (!d.columns.some((c) => c.name === name)) continue;
      const wc = (d.columns.find((c) => c.role === 'wafer') || {}).name || S.cfg.waferCol;
      const xc = (d.columns.find((c) => c.role === 'x') || {}).name, yc = (d.columns.find((c) => c.role === 'y') || {}).name;
      const rc = d.columns.find((c) => c.name === 'R (mm)') ? 'R (mm)' : null;
      if (!rc && !(xc && yc)) continue;
      return { d, wc, R: (r) => (rc ? num(r[rc]) : num(r[xc]) != null && num(r[yc]) != null ? Math.hypot(r[xc], r[yc]) : null) };
    }
    return null;
  }
  const hasRadial = (name) => !!siteTableFor(name);
  /** Radial profile: site value vs R, BSL grey vs CIP coloured, with mean line per radius */
  function radialFig(itemName, group, h = 250, opts = {}) {
    const c = S.cfg, st = siteTableFor(itemName); if (!st) return null;
    const wi = waferInfo();
    const conds = [c.baseline, ...c.cips];
    const acc = new Map(conds.map((cd) => [cd, []]));
    for (const r of st.d.rows) {
      const v = num(r[itemName]), R = st.R(r), w = wi.get(r[st.wc]);
      if (v == null || R == null || !w || (group !== '全部' && w.g !== group) || !acc.has(w.c)) continue;
      acc.get(w.c).push({ R: Math.round(R), v, w: r[st.wc] });
    }
    const data = [];

      const a = acc.get(cd); if (!a.length) return;
      const col = cd === c.baseline ? BSLC : cipColor(cd), off = (i - (conds.length - 1) / 2) * 2.2;
      const sh = cd === c.baseline ? sample(a, 2500) : a;
